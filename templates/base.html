{% load static %}
<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Rudy's KFZ Service{% endblock %}</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous">
 
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">


  <!-- Global CSS --> 
  <link rel="stylesheet" href="{% static 'css/base.css' %}">


  <!-- Page-specific HEAD additions -->
  {% block extra_head %}{% endblock %}
</head>

<body>
  <!-- Navbar include -->
  {% include "includes/navbar.html" %}

  <!-- Main Content -->
  <main class="container my-4">
    {% block content %}{% endblock %}
  </main>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.4.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous">
  </script>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script> 
  <script src="{% static 'invoices/js/main.js' %}"></script>
 

  {% block extra_js %}{% endblock %}
</body>

</html>
