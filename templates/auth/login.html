{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h3 class="mb-3">{% trans "Login" %}</h3>

      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn btn-primary w-100" type="submit">
          {% trans "Login" %}
        </button>
      </form>

      <div class="mt-3 text-center">
        <a href="{% url 'auth:register' %}">{% trans "Create account" %}</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
