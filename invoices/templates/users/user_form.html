{% extends "base.html" %}
{% load i18n %}

{% block content %}
<h2>{% trans "Add user" %}</h2>

<form method="post" enctype="multipart/form-data" class="mt-3">
  {% csrf_token %}
  {{ form.as_p }}

  <button type="submit" class="btn btn-success">{% trans "Save" %}</button>
  <a href="{% url 'users:list' %}" class="btn btn-secondary">{% trans "Cancel" %}</a>
</form>
{% endblock %}
