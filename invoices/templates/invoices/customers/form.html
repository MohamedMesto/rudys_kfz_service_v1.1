{% extends "base.html" %}

{% block title %}{% trans "Customer" %}{% endblock %}

{% block content %}
<h2>{% if object %}{% trans "Customer" %} {% trans "Edit" %} {% else %} {% trans "New Customer" %}{% endif %}</h2>

<form method="post" class="mt-3">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        {% trans "Save" %}
    </button>
    <a href="{% url 'customers:list' %}" class="btn btn-secondary">
        {% trans "Cancel" %}
    </a>
</form>
{% endblock %}
