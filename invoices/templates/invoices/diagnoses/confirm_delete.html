{% extends 'base.html' %}

{% block title %}Diagnose löschen{% endblock %}

{% block content %}
<h2>Diagnose löschen</h2>
<p>Sind Sie sicher, dass Sie die Diagnose "{{ object.diagnosis_title }}" löschen möchten?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Ja, löschen</button>
    <a href="{% url 'diagnoses:list' %}" class="btn btn-secondary">Abbrechen</a>
</form>
{% endblock %}
