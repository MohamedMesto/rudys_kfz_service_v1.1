<!-- rudys_kfz_service_v1.1/invoices/templates/invoices/companies/form.html -->
{% extends "base.html" %}

{% block title %}Firma{% endblock %}

{% block content %}
<h2>{% if object %}Firma bearbeiten{% else %}Neue Firma{% endif %}</h2>

<form method="post" class="mt-3">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        Speichern
    </button>
    <a href="{% url 'companies:list' %}" class="btn btn-secondary">
        Abbrechen
    </a>
</form>
{% endblock %}
