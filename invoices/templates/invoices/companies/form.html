{% extends "base.html" %}

{% block title %}{% trans "Company" %}{% endblock %}

{% block content %}
<h2>{% if object %}{% trans "Company" %} {% trans "Edit" %} {% else %}Neue {% trans "Company" %}{% endif %}</h2>

<form method="post" class="mt-3">

        {% trans "Cancel" %}
    </a>
</form>
{% endblock %}
