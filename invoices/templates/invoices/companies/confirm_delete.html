{% extends "base.html" %}

{% block title %}Firma löschen{% endblock %}

{% block content %}
<h2>Firma löschen</h2>

<p>Möchten Sie die Firma <strong>{{ object.company_name }}</strong> wirklich löschen?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Ja, löschen</button>
    <a href="{% url 'companies:list' %}" class="btn btn-secondary">Abbrechen</a>
</form>
{% endblock %}
