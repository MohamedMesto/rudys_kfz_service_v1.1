{% extends "base.html" %}

{% block title %}Rechnung{% endblock %}

{% block content %}
<h2>{% if object %}Rechnung bearbeiten{% else %}Neue Rechnung{% endif %}</h2>

<form method="post" class="mt-3">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        Speichern
    </button>
    <a href="{% url 'invoices:list' %}" class="btn btn-secondary">
        Abbrechen
    </a>
</form>
{% endblock %}
