{% extends "base.html" %}{% load i18n %}

{% block title %}
{% trans "Invoices" %}
{% endblock %}

{% block content %}
<h2>{% if object %}{% trans "Invoices" %} {% trans "Edit" %} {% else %} {% trans "New Invoices" %}{% endif %}</h2>

<form method="post" class="mt-3">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        {% trans "Save" %}
    </button>
    <a href="{% url 'invoices:list' %}" class="btn btn-secondary">
        {% trans "Cancel" %}
    </a>
</form>
{% endblock %}
