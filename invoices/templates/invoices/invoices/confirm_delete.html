{% extends 'base.html' %}

{% block title %}Rechnung löschen{% endblock %}

{% block content %}
<h2>Rechnung löschen</h2>

<p>
    Möchten Sie die Rechnung <strong>{{ object.invoice_number }}</strong> wirklich löschen?
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Ja, löschen</button>
    <a href="{% url 'invoices:list' %}" class="btn btn-secondary">Abbrechen</a>
</form>
{% endblock %}
