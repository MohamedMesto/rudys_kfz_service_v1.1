{% extends 'base.html' %} {% block title %}{% trans "Invoices Delete" %} {%
endblock %} {% block content %}
<h2>{% trans "Invoices Delete" %}</h2>

<p>
  {% trans " Are you sure you want to delete the Invoices" %}
  <strong>{{ object.invoice_number }}</strong> ?
</p>

<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">
    {% trans "Yes, Delete" %}
  </button>
  <a href="{% url 'invoices:list' %}" class="btn btn-secondary"
    >{% trans "Cancel" %}</a
  >
</form>
{% endblock %}
